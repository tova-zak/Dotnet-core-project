<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="../js/login.js" defer></script> <!-- מסביר: טוען את קובץ ה-JS הנכון מתוך תיקיית ../js -->
</head>
<body style="direction:rtl;text-align:right;">
    <h1>Login</h1>
    <!-- הסבר: כאן המשתמש מציין את שם החנות (ShopName) והסיסמה כדי לקבל טוקן כניסה -->
    <form id="loginForm" action="javascript:void(0);" onsubmit="loginUser()">
        <input type="text" id="shopName" placeholder="שם החנות" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="submit" value="Login">
    </form>
</body>
</html>
