<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Pizza CRUD</title>
    <link rel="stylesheet" href="../css/site.css" />
    <script>
        // Check for token
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html'; // Redirect to the login page if no token is found
        }
    </script>
</head>

<body>
    <div class="container"> <!-- מרכז את התוכן -->
        <h1>USER</h1>
        <h3>Add</h3>
        <form action="javascript:void(0);" method="POST" onsubmit="addUser()">
            <!-- שדות נפרדים לשם פרטי ושם משפחה -->
            <input type="text" id="add-firstName" placeholder="First Name" required>
            <input type="text" id="add-lastName" placeholder="Last Name" required>
            <input type="submit" value="Add">
        </form>

        <div id="editForm">
            <h3>Edit</h3>
            <form action="javascript:void(0);" onsubmit="updateUser()">
                <input type="hidden" id="edit-id">
                <input type="text" id="edit-firstName" placeholder="First Name">
                <input type="text" id="edit-lastName" placeholder="Last Name">
                <input type="submit" value="Save">
                <a onclick="closeInput()" aria-label="Close">&#10006;</a>
            </form>
        </div>

        <p id="counter"></p>

        <table>
            <tr>
                <th>FirstName</th>
                <th>LastName</th>
                <th></th>
                <th></th>
            </tr>
            <tbody id="users"></tbody>
        </table>
        <a href="../index.html">למעבר לגלידות</a>
    </div>
    <script src="../js/user.js" asp-append-version="true"></script>
    <script type="text/javascript">
        getUsers();
    </script>
</body>

</html>
