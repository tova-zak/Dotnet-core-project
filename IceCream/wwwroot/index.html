<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>User CRUD</title>
    <link rel="stylesheet" href="css/site.css" />
    <script>
        // בדיקה האם יש טוקן שמאוחסן בדפדפן
        if (!localStorage.getItem('token')) { // אם אין טוקן
            window.location.href = './html/login.html'; // מפנה לעמוד ההתחברות
        }
    </script>
</head>

<body>
    <div class="container"> <!-- כל התוכן ממורכז בתוך הקונטיינר -->
        <h1>ICECREM CITY</h1>
        <h3>Add</h3>
        <form action="javascript:void(0);" method="POST" onsubmit="addItem()">
            <input type="text" id="add-name" placeholder="New iceCream" required>
            <!-- תיבת סימון שמציינת האם זה חלבי -->
            <label style="display:inline-flex;align-items:center;gap:8px;margin-left:8px;">
                <input type="checkbox" id="add-IsDiary"> חלבי?
            </label>
            <input type="submit" value="Add">
        </form>

        <div id="editForm">
            <h3>Edit</h3>
            <form action="javascript:void(0);" onsubmit="updateItem()">
                <input type="hidden" id="edit-id">
                <input type="checkbox" id="edit-IsDiary">
                <input type="text" id="edit-name">
                <input type="submit" value="Save">
                <a onclick="closeInput()" aria-label="Close">&#10006;</a>
            </form>
        </div>

        <p id="counter"></p>

        <table>
            <tr>
                <th>Is diary?</th>
                <th>Name</th>
                <th></th>
                <th></th>
            </tr>
            <tbody id="iceCreams"></tbody>
        </table>
        <a href="./html/user.html">למעבר למשתמשים</a>
    </div>
    <script src="js/site.js" asp-append-version="true"></script>
    <script type="text/javascript">
        getItems();
    </script>

</body>

</html>
